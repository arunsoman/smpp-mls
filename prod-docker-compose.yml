version: '3.8'

services:
  # ClickHouse Database
  shahy-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: shahy-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      CLICKHOUSE_DB: smpp_archive
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - smpp-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SMPP MLS Application
  smpp-mls:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smpp-mls
    ports:
      - "2222:2222"  # Application port
    environment:
      # ClickHouse Configuration
      CLICKHOUSE_URL: jdbc:clickhouse://shahy-clickhouse:8123/default
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_ARCHIVE_ENABLED: "true"
      CLICKHOUSE_ARCHIVE_AGE_MINUTES: "5"
      CLICKHOUSE_ARCHIVE_SCHEDULE_CRON: "0 */5 * * * ?"
      CLICKHOUSE_ARCHIVE_DATABASE: smpp_archive
      
      # H2 Database (in-memory)
      SPRING_DATASOURCE_URL: jdbc:h2:mem:smppdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: password
      
      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      shahy-clickhouse:
        condition: service_healthy
    networks:
      - smpp-network
    restart: unless-stopped

volumes:
  clickhouse-data:
    driver: local

networks:
  smpp-network:
    driver: bridge
