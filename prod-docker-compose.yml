version: '3.8'

services:
  # SMPP MLS Application
  smpp-mls:
    image: cascade/smpp-mls
    pull_policy: never
    container_name: smpp-mls
    restart: unless-stopped
    
    environment:
      - ACTIVE_PROFILE=prod,hikari,monitoring
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Dspring.lifecycle.timeout-per-shutdown-phase=30s
      # ClickHouse Configuration (external ClickHouse instance)
      - CLICKHOUSE_URL=jdbc:clickhouse://shahy-clickhouse:8123/default
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_ARCHIVE_ENABLED=true
      - CLICKHOUSE_ARCHIVE_AGE_MINUTES=5
      - CLICKHOUSE_ARCHIVE_SCHEDULE_CRON=0 */5 * * * ?
      - CLICKHOUSE_ARCHIVE_DATABASE=smpp_archive
      # Redis Configuration
      - REDIS_HOST=smpp-redis
      - REDIS_PORT=6379
      - REDIS_TIMEOUT=2000
    
    ports:
      - "2222:2222"
    
    volumes:
      - /home/ubuntu/glowroot-master/smpp-mls/glowroot:/usr/local/glowroot:rw
      - /var/log/mls-app/smpp-mls:/app/external-logs
      - /var/log/mls-trace/smpp-mls:/app/access-logs
      - /home/ubuntu/lctr:/lctr
    
    networks:
      - smpp
    
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 2G
          cpus: '2.0'
    
    stop_grace_period: 30s
    
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    container_name: smpp-redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
    
    networks:
      - smpp
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  smpp:
    name: smpp
    driver: bridge

volumes:
  redis-data:
    driver: local
